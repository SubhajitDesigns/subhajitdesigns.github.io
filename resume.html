
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subhajit Das — Resume</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #080808;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px 40px;
    }

    .resume-actions {
      width: min(100%, 900px);
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      background: #ff3028;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .download-btn:hover {
      background: #ff4942;
      transform: translateY(-2px);
    }

    .resume-image {
      display: block;
      width: min(900px, 100%);
      height: auto;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px 10px 25px;
      }

      .resume-actions {
        justify-content: center;
        margin-bottom: 14px;
      }

      .download-btn {
        width: 100%;
        max-width: 300px;
      }

      .resume-image {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="resume-actions">
    <a
      class="download-btn"
      href="Resume.pdf"
      download="Subhajit-Das-Resume.pdf"
    >
      ↓ Download Resume
    </a>
  </div>

  <img
    class="resume-image"
    src="resume-image.png"
    alt="Subhajit Das Resume"
  >

</body>
</html>
