<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About — Subhajit</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#030303;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.about{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:650px;
  overflow:hidden;
  background:#030303 url("about-background.png") center center/cover no-repeat;
}
.about:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,.05) 43%,rgba(0,0,0,.10) 100%);
}
.content{
  position:relative;
  z-index:3;
  width:54%;
  height:100%;
  padding:9vh 0 8vh 7vw;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.eyebrow{
  color:#ef3b2d;
  font-size:clamp(14px,1.2vw,21px);
  font-weight:800;
  letter-spacing:.13em;
  margin:0 0 1.6vh;
  text-transform:uppercase;
}
h1{
  margin:0 0 .8vh;
  font-size:clamp(46px,5.2vw,82px);
  line-height:.94;
  letter-spacing:-.045em;
  color:#fff;
  font-weight:900;
  text-shadow:0 4px 25px rgba(0,0,0,.45);
}
.subtitle{
  margin:0 0 2vh;
  color:#ef3b2d;
  font-size:clamp(17px,1.55vw,25px);
  line-height:1.15;
  font-weight:800;
}
.typebox{
  max-width:690px;
  font-size:clamp(14px,1.08vw,18px);
  line-height:1.48;
  color:#f3f3f3;
  text-shadow:0 2px 13px rgba(0,0,0,.9);
}
.type-line{margin:0 0 1.2vh;min-height:1.55em}
.type-line strong{color:#fff;font-weight:800}
.caret{
  display:inline-block;
  width:.08em;
  height:1em;
  margin-left:3px;
  background:#ef3b2d;
  vertical-align:-.12em;
  animation:blink .7s step-end infinite;
}
@keyframes blink{50%{opacity:0}}
.badge{
  margin-top:2vh;
  display:inline-flex;
  align-items:center;
  gap:20px;
  width:max-content;
  max-width:90%;
  padding:16px 28px;
  border:1px solid rgba(239,59,45,.65);
  border-radius:999px;
  background:rgba(0,0,0,.48);
  backdrop-filter:blur(5px);
  box-shadow:0 0 30px rgba(220,25,15,.16);
  font-size:clamp(18px,1.55vw,27px);
}
.badge .number{color:#ef3b2d;font-weight:900}
.photo{
  position:absolute;
  z-index:4;
  right:1.5vw;
  bottom:-3vh;
  width:min(48vw,760px);
  height:96vh;
  object-fit:contain;
  object-position:center bottom;
  filter:drop-shadow(-14px 15px 26px rgba(0,0,0,.72));
  transform-origin:center bottom;
  animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes arrive{
  from{opacity:0;transform:translateX(80px) scale(.88)}
  to{opacity:1;transform:translateX(0) scale(1)}
}
.back{
  position:absolute;
  z-index:6;
  left:7vw;
  bottom:4vh;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  padding:10px 15px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(5px);
  transition:.25s;
}
.back:hover{transform:translateX(-3px);border-color:#ef3b2d;color:#ef3b2d}

@media(max-width:900px){
  html,body{overflow:auto}
  .about{height:auto;min-height:100vh;padding-bottom:40px;background-position:center}
  .content{width:100%;height:auto;min-height:72vh;padding:9vh 7vw 0;justify-content:flex-start;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.12))}
  h1{font-size:clamp(50px,12vw,82px)}
  .typebox{font-size:17px;max-width:720px}
  .photo{position:relative;right:auto;bottom:auto;display:block;margin:-2vh auto 0;width:min(86vw,610px);height:auto;max-height:75vh;object-fit:contain}
  .back{position:relative;left:auto;bottom:auto;display:inline-block;margin:20px 7vw 0}
}
</style>
</head>
<body>
<main class="about">
  <section class="content">
    <p class="eyebrow">Creative Portfolio — Presentation</p>
    <h1>Meet The Designer</h1>
    <p class="subtitle">Designing with Purpose, Passion &amp; Experience</p>
    <div class="typebox" aria-live="polite">
      <p class="type-line" id="line1"></p>
      <p class="type-line" id="line2"></p>
      <p class="type-line" id="line3"></p>
    </div>
    <div class="badge"><span>🤝</span><span>Worked with</span><span class="number">50+ Brands</span></div>
  </section>
  <img class="photo" src="about-photo.png" alt="Subhajit Das">
  <a class="back" href="index.html">← Back to Home</a>
</main>
<script>
const lines = [
  'Hey myself Subhajit Das, I’m a 26-year-old dedicated graphic designer with over 6 years of professional experience. After completing my schooling in 2017, financial limitations prevented me from finishing college—but they never limited my ambition.',
  'Since then, I’ve built my career through self-learning, continuous practice, and real client projects. I’ve collaborated with 50+ brands, helping them strengthen their visual identity and stand out in competitive markets.',
  'My work blends creativity with clarity. I focus on clean, effective design that captures attention, communicates ideas, and drives engagement. I’m always learning, evolving, and pushing my skills to deliver better results every day.'
];
const els=[line1,line2,line3];
let i=0,c=0;
function typeNext(){
  if(i>=lines.length){ return; }
  els[i].textContent=lines[i].slice(0,c++);
  if(c<=lines[i].length){
    setTimeout(typeNext, 18);
  }else{
    i++;c=0;setTimeout(typeNext, 350);
  }
}
typeNext();
</script>
</body>
</html>
